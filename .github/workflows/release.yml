name: Release

on:
    push:
        branches:
            - main
            - next

permissions:
    # Enable `semantic-release` to publish a GitHub release and push commits
    contents: write
    # Enable `semantic-release` to post comments on issues
    issues: write
    # Enable `semantic-release` to post comments on pull requests
    pull-requests: write
    # Enable the use of OIDC for trusted publishing and npm provenance
    id-token: write
    # Publish each release to GitHub Packages too
    packages: write

# Release involves crucial steps that shouldn't be cancelled mid-run,
# so new workflow runs are queued until the previous one finishes.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

jobs:
    release:
        name: Release
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
            - name: Generate bot token
              id: generate_token
              uses: actions/create-github-app-token@v1
              with:
                  app-id: ${{ secrets.DOIST_RELEASE_BOT_ID }}
                  private-key: ${{ secrets.DOIST_RELEASE_BOT_PRIVATE_KEY }}
                  permission-contents: write
                  permission-issues: write
                  permission-pull-requests: write

            - name: Get bot user ID
              id: bot_user
              run: |
                  user_id=$(gh api "/users/${{ steps.generate_token.outputs.app-slug }}[bot]" --jq .id)
                  if [ -z "$user_id" ]; then
                      echo "Failed to get bot user ID" >&2
                      exit 1
                  fi
                  echo "id=$user_id" >> "$GITHUB_OUTPUT"
              env:
                  GH_TOKEN: ${{ steps.generate_token.outputs.token }}

            - name: Checkout repository
              uses: actions/checkout@v6
              with:
                  token: ${{ steps.generate_token.outputs.token }}
                  fetch-depth: 0

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version-file: .nvmrc
                  cache: npm
                  scope: '@todoist'
                  registry-url: 'https://registry.npmjs.org/'

            - name: Install dependencies
              run: npm ci

            - name: Release
              run: npx semantic-release
              env:
                  GITHUB_TOKEN: ${{ steps.generate_token.outputs.token }}
                  GIT_AUTHOR_NAME: ${{ steps.generate_token.outputs.app-slug }}[bot]
                  GIT_AUTHOR_EMAIL: ${{ steps.bot_user.outputs.id }}+${{ steps.generate_token.outputs.app-slug }}[bot]@users.noreply.github.com
                  GIT_COMMITTER_NAME: ${{ steps.generate_token.outputs.app-slug }}[bot]
                  GIT_COMMITTER_EMAIL: ${{ steps.bot_user.outputs.id }}+${{ steps.generate_token.outputs.app-slug }}[bot]@users.noreply.github.com
                  # `npm ci` installs the git hooks (the `prepare` script). The pull request
                  # already ran every check, so the release commit and push skip them.
                  LEFTHOOK: '0'

            # Projects that read the @todoist scope from GitHub Packages, where Doist's
            # private @todoist packages are, install this one from there too: npm reads a
            # whole scope from one registry. This publishes the tarball @semantic-release/npm
            # packed for the release; with no tarball, nothing was released.
            - name: Publish to GitHub Packages
              env:
                  TARBALL_DIR: ${{ github.workspace }}/.tmp/release
                  TAG: ${{ github.ref_name == 'next' && 'next' || 'latest' }}
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  shopt -s nullglob
                  tarballs=("$TARBALL_DIR"/*.tgz)
                  if [ "${#tarballs[@]}" -eq 0 ]; then
                      echo "Nothing was released."
                      exit 0
                  fi

                  # Publishes on GitHub Packages only, whatever setup-node set up for npm.
                  github_npmrc="${RUNNER_TEMP}/github.npmrc"
                  printf '%s\n' \
                      'registry=https://npm.pkg.github.com/' \
                      '@todoist:registry=https://npm.pkg.github.com/' \
                      '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' > "$github_npmrc"

                  # npm reads an .npmrc in the working directory as project config, which wins
                  # over NPM_CONFIG_USERCONFIG. setup-node writes its npm config to
                  # RUNNER_TEMP/.npmrc, so publishing from RUNNER_TEMP would go to npm. In an
                  # empty directory only the GitHub Packages config above applies.
                  cd "$(mktemp -d)"

                  # npm's copy carries provenance for the release build; this
                  # copy is published here, so it claims none.
                  NPM_CONFIG_USERCONFIG="$github_npmrc" npm publish "${tarballs[0]}" \
                      --ignore-scripts --provenance=false --tag="$TAG"
