name: Deploy Docs to Pages

on:
    push:
        branches:
            - main
    workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
    contents: read
    pages: write
    id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
    group: 'pages'
    cancel-in-progress: false

jobs:
    # Single deploy job since we're just deploying
    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version-file: .nvmrc

            - name: Install SDK dependencies
              run: npm ci

            - name: Install docusaurus dependencies
              working-directory: ./website
              run: npm ci

            - name: Build documentation
              working-directory: ./website
              run: npm run build

            - name: Setup Pages
              uses: actions/configure-pages@v5

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: './website/build'

            # deploy-pages looks the artifact up straight after the upload, and the artifact
            # service can take from under a second to most of a minute to list it, failing the
            # deploy with "No artifacts named github-pages were found":
            # https://github.com/actions/deploy-pages/issues/451. Pages can also fail a
            # deployment it accepted ("Deployment failed, try again later."). Neither leaves a
            # live deployment behind (a missed lookup creates none, and deploy-pages leaves a
            # failed one failed or cancels it), so the deploy is tried once more after a
            # pause, whichever way it failed. Re-running the job doesn't help: it uploads a
            # second artifact, and deploy-pages refuses two.
            - name: Deploy to GitHub Pages
              id: deployment
              continue-on-error: true
              uses: actions/deploy-pages@v4

            - name: Wait for the artifact to be listed
              if: steps.deployment.outcome == 'failure'
              run: sleep 60

            - name: Deploy to GitHub Pages (retry)
              id: deployment_retry
              if: steps.deployment.outcome == 'failure'
              uses: actions/deploy-pages@v4
